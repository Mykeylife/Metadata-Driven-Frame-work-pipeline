[project]
name = "metadata-driven-frame-work-pipeline"
version = "0.1.0"
description = "A production-grade local metadata-driven pipeline orchestrator with built-in quality gates and webhook telemetry."
authors = [
    { name = "Olanrewaju Micheal Akinbode", email = "mykeylife6@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
mypy = "^1.11.0"
pytest = "^8.0.0"
pytest-cov = "^5.0.0"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q --cov=pipeline --cov-report=term-missing"

[tool.poetry.scripts]
pipeline = "orchestrator:main"
init-db = "init_simulation_db:init_db"
