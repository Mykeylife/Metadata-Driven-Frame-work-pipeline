[tool.poetry]
name = "metadata-driven-frame-work-pipeline"
version = "0.1.0"
description = "A production-grade local metadata-driven pipeline orchestrator with built-in quality gates and webhook telemetry."
authors = ["Olanrewaju Micheal Akinbode <mykeylife6@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0"
requests = "^2.31.0" 

[tool.poetry.group.dev.dependencies]
mypy = "^1.11.0"
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
black = "^24.0.0"
ruff = "^0.6.0"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "W291", "B007"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "pipeline/tests"]
addopts = "-ra -q --cov=. --cov-report=term-missing"

[tool.poetry.scripts]
pipeline = "orchestrator:main"
init-db = "init_simulation_db:init_db"
