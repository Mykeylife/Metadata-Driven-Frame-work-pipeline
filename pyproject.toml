[tool.poetry]
name = "metadata-driven-frame-work-pipeline"
version = "0.1.0"
description = "A production-grade local metadata-driven pipeline orchestrator with built-in quality gates and webhook telemetry."
authors = ["Olanrewaju Micheal Akinbode <mykeylife6@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0"
requests = "^2.31.0" 

[tool.poetry.group.dev.dependencies]
mypy = "^1.11.0"
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.0"

# =====================================================================
# Ruff: Integrated Linting & Formatting (Migrated from your .flake8 file)
# =====================================================================
[tool.ruff]
target-version = "py311"
line-length = 88 # Strictly matched to your former .flake8 rule
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    ".poetry"
]

[tool.ruff.lint]
# E/W: Pycodestyle, F: Pyflakes, C: McCabes complexity / C4, I: Isort
# N: Pep8-naming, UP: Pyupgrade, B: Flake8-bugbear are included for production safety
select = ["E", "F", "W", "C", "I", "N", "UP", "B", "C4"]
ignore = [
    "E501", # Line too long (handled natively by ruff format)
    "W291", # Trailing whitespace
    "B007", # Unused loop control variables
    "E203"  # Whitespace before ':' (Migrated from your former ignore list)
    # W503 (Line break before binary operator) is obsolete in Ruff/PEP8 and ignored automatically
]

[tool.ruff.lint.isort]
combine-as-imports = true
forced-separate = ["pipeline"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# =====================================================================
# Mypy: Static Type System Gates
# =====================================================================
[tool.mypy]
python_version = "3.11"
files = ["pipeline", "orchestrator.py", "models.py"]
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q --cov=pipeline --cov-report=term-missing"

[tool.poetry.scripts]
pipeline = "orchestrator:main"
init-db = "init_simulation_db:init_db"
