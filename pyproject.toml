[tool.poetry]
name = "metadata-driven-frame-work-pipeline"
version = "0.1.0"
description = "A metadata-driven pipeline orchestrator with SQLite backing"
authors = ["Olanrewaju Micheal Akinbode <mykeylife6@gmail.com>"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
# Sets strict linting rules equivalent to flake8, black style, and clean imports
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = []

[tool.coverage.run]
source = ["backend"]
branch = true
omit = [
    "init_simulation_db.py",
    "tests/*",
    "test_*"
]

[tool.coverage.report]
# Tighten the gate: Forces code scoring engines to demand high code-coverage
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError"
]
