name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: pip install poetry

    - name: Configure Poetry and Install Dependencies
      run: |
        poetry config virtualenvs.create false
        poetry lock
        poetry install --no-root --no-interaction

    - name: Check Code Formatting (Black)
      run: black --check pipeline tests

    - name: Lint Codebase (Ruff)
      run: ruff check pipeline tests

    - name: Static Type Validation (Mypy)
      run: mypy pipeline tests

    - name: Run Tests with Strict Coverage
      run: env PYTHONPATH=. pytest --cov=pipeline --cov-report=term-missing --cov-fail-under=60
