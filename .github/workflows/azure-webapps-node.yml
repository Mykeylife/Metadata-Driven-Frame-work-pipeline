name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: pip install poetry

    - name: Automatically Repair and Sync Lockfile
      run: |
        poetry lock

    - name: Install Dependencies from Lockfile
      run: |
        poetry config virtualenvs.create false
        poetry install --no-root --no-interaction

    - name: Run Database Seeder Check
      run: |
        if [ -f seed_metadata.py ]; then
          python seed_metadata.py
        else
          echo "seed_metadata.py not found in root, skipping execution check."
        fi

    - name: Auto-Format and Lint Codebase
      run: |
        pip install ruff black
        black .
        ruff check . --ignore E501 --fix

    - name: Static type check with Mypy
      run: |
        if [ -f mypy.ini ]; then
          mypy --config-file mypy.ini --explicit-package-bases .
        else
          mypy --explicit-package-bases .
        fi

    - name: Run tests with code coverage
      run: |
        export PYTHONPATH=.
        if [ -f test_dag_runner.py ]; then
          pytest test_dag_runner.py --cov=. --cov-report=term-missing
        else
          pytest --cov=. --cov-report=term-missing
        fi
