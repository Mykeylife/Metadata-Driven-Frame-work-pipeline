name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-numeric-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements-lock.txt ]; then
          pip install -r requirements-lock.txt
        else
          pip install -r requirements.txt
          pip install pytest pytest-cov black flake8 mypy pydantic
          pip freeze > requirements-lock.txt
        fi

    - name: Check formatting with Black
      run: black --check orchestrator.py

    - name: Lint with flake8
      run: flake8 orchestrator.py

    - name: Static type check with Mypy
      run: mypy orchestrator.py

    - name: Run tests with code coverage
      run: |
        pytest --cov=. --cov-report=term-missing --cov-fail-under=70
    - name: Check formatting with Black
      run: black --check adf-src/

    - name: Lint with flake8
      run: flake8 adf-src/

    - name: Static type check with Mypy
      run: mypy adf-src/

    - name: Run tests with code coverage
      run: |
        pytest --cov=adf-src/ --cov-report=term-missing --cov-fail-under=70
        
