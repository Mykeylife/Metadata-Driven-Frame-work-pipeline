name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: pip install poetry

    - name: Verify Lock File Consistency
      run: poetry check

    - name: Install Dependencies from Lockfile
      run: |
        poetry config virtualenvs.create false
        poetry install --no-root --no-interaction --sync

    - name: Run Database Seeder Check
      run: python seed_metadata.py

    - name: Lint with ruff and black
      run: |
        pip install ruff black
        ruff check .
        black --check .

    - name: Static type check with Mypy
      run: mypy --explicit-package-bases pipeline tests

    - name: Run tests with code coverage
      run: env PYTHONPATH=. pytest --cov=pipeline --cov-report=term-missing --cov-fail-under=80
