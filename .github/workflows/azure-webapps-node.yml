name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: pip install poetry

    - name: Automatically Repair and Sync Lockfile
      run: |
        poetry lock --no-update

    - name: Install Dependencies from Lockfile
      run: |
        poetry config virtualenvs.create false
        poetry install --no-root --no-interaction --sync

    - name: Run Database Seeder Check
      run: python seed_metadata.py

    - name: Lint with ruff and black
      run: |
        pip install ruff black
        ruff check .
        black --check .

    - name: Static type check with Mypy
      run: mypy --explicit-package-bases pipeline tests

    - name: Run tests with code coverage
      run: env PYTHONPATH=. pytest --cov=pipeline --cov-report=term-missing --cov-fail-under=80

    - name: Auto-Commit Fixed Lockfile back to Repo
      if: github.ref == 'refs/heads/main'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add poetry.lock
        git diff-index --quiet HEAD || git commit -m "chore: auto-align lockfile to resolve DataFactor Item 7"
        git push
