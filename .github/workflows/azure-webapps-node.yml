name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: pipx install poetry

    - name: Regenerate Lock File and Install Dependencies
      # Fix: Removed the non-existent --no-update flag so it locks normally
      run: |
        poetry lock
        poetry install

    - name: Static type check with Mypy
      run: poetry run mypy --explicit-package-bases pipeline tests

    - name: Run tests with code coverage
      run: poetry run env PYTHONPATH=. pytest --cov=pipeline --cov-report=term-missing --cov-fail-under=40
