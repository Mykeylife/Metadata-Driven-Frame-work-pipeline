name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: pip install poetry

    - name: Regenerate Lock File and Install Dependencies
      run: |
        poetry config virtualenvs.create false
        poetry lock
        poetry install --no-root --no-interaction

    - name: Static type check with Mypy
      run: mypy --explicit-package-bases pipeline tests || true

    - name: Run tests with code coverage
      run: env PYTHONPATH=. pytest --cov=pipeline --cov-report=term-missing --cov-fail-under=40
