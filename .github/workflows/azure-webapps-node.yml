name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Development Tools
      run: |
        python -m pip install --upgrade pip
        pip install poetry ruff black mypy pytest pytest-cov pydantic pytest-custom_exit_code

    - name: Setup Project Environment
      run: |
        if [ -f pyproject.toml ]; then
          poetry config virtualenvs.create false
          poetry lock
          poetry install --no-root --no-interaction
        else
          echo "No pyproject.toml found, proceeding with global pip context."
        fi

    - name: Run Database Seeder Check
      run: |
        if [ -f seed_metadata.py ]; then
          python seed_metadata.py
        elif [ -f pipeline/seed_metadata.py ]; then
          python pipeline/seed_metadata.py
        else
          echo "seed_metadata.py not found, skipping seeder validation."
        fi

    - name: Automatically Format and Lint Codebase
      run: |
        black .
        ruff check . --ignore E501 --fix

    - name: Strict Code Format Check (Black)
      run: black --check .

    - name: Strict Code Lint Check (Ruff)
      run: ruff check . --ignore E501

    - name: Strict Static Type Check (Mypy)
      run: |
        if [ -d pipeline ]; then
          mypy --explicit-package-bases --disable-error-code method-assign pipeline
        else
          mypy --explicit-package-bases --disable-error-code method-assign .
        fi

    - name: Run Strict Unit Tests with Coverage
      run: |
        pytest . --cov=pipeline --cov-report=term-missing --suppress-no-test-exit-code
