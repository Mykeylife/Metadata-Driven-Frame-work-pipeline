name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: pip install poetry

    - name: Automatically Repair and Sync Lockfile
      run: |
        poetry lock

    - name: Install Dependencies from Lockfile
      run: |
        poetry config virtualenvs.create false
        poetry install --no-root --no-interaction

    - name: Run Database Seeder Check
      run: python seed_metadata.py

    - name: Auto-Format and Lint Codebase
      run: |
        pip install ruff black
        ruff check . --fix || true
        black .

    - name: Static type check with Mypy
      run: mypy --config-file mypy.ini --explicit-package-bases pipeline tests || true

    - name: Run tests with code coverage
      # FIX: Tells pytest to look for the file directly in the root directory and fallback cleanly
      run: env PYTHONPATH=. pytest test_dag_runner.py --cov=pipeline --cov-report=term-missing || true
