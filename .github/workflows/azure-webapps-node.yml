name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 1. FIX: Grant the runner explicit write permissions to commit style updates
permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        # Fetch the head ref during pull requests so git doesn't end up in a detached HEAD state
        ref: ${{ github.head_ref || github.ref }}

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: pip install poetry

    - name: Load Cached Virtualenv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install Dependencies from Lockfile
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: |
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true
        poetry install --no-root --no-interaction

    - name: Run Database Seeder Check
      run: |
        if [ -f init_simulation_db.py ]; then
          poetry run python init_simulation_db.py
        else
          echo "Database initiation script missing, skipping."
        fi

    # 2. FIX: Combine Auto-Format and Linter Fixes with Ruff
    - name: Automatically Format and Lint Codebase
      run: |
        poetry run ruff format .
        poetry run ruff check . --fix

    # 3. FIX: Safely push back updates ONLY if changes were made
    - name: Commit and Push Formatting Fixes
      if: github.event_name == 'pull_request'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git diff-index --quiet HEAD || (git commit -m "style: auto-format codebase with Ruff" && git push)

    # 4. FIX: Use strict verification checks after resolving git state
    - name: Strict Code Format and Lint Check (Ruff)
      run: |
        poetry run ruff format --check .
        poetry run ruff check .

    - name: Strict Static Type Check (Mypy)
      run: poetry run mypy

    - name: Run Strict Unit Tests with Coverage
      run: poetry run pytest
