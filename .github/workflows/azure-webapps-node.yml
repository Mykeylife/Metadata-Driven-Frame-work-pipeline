name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements-lock.txt ]; then
          pip install -r requirements-lock.txt
        else
          pip install -r requirements.txt
          pip install pytest pytest-cov black flake8 mypy pydantic
          pip freeze > requirements-lock.txt
        fi
    - name: Auto-format with Black
      run: black adf-src/ || true

    - name: Lint with flake8 (Non-blocking)
      run: flake8 adf-src/ || true

    - name: Static type check with Mypy (Non-blocking)
      run: mypy adf-src/ || true

    - name: Run tests with code coverage
      run: |
        pytest --cov=adf-src/ --cov-report=term-missing --cov-fail-under=10 || true
