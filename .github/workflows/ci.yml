name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Pipx and Poetry
      run: |
        pip install --user pipx
        pipx ensurepath
        pipx install poetry==1.8.3

    - name: Configure Poetry Path
      run: |
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Set up Poetry Cache
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'poetry'

    - name: Strict Lock File Integrity Check
      run: |
        poetry lock --no-update
        poetry check --lock

    - name: Safe Sync and Install Dependencies
      run: poetry install --no-interaction --no-root --sync --with dev

    - name: Run Code Linters & Formatters
      run: |
        poetry run ruff check . --fix
        poetry run ruff format .

    # We use your file test_dag_runner.py here as the test suite entry point
    # To run coverage on the pipeline module matching your layout
    - name: Execute Test Suite with Coverage
      run: poetry run pytest test_dag_runner.py --cov=pipeline --cov-report=term-missing
