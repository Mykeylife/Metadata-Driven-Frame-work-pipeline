name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # Give GitHub Actions permission to push code updates back to the repo
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Pipx and Poetry
      run: |
        pip install --user pipx
        pipx ensurepath
        pipx install poetry==1.8.3

    - name: Configure Poetry Path
      run: |
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Set up Poetry Cache
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'poetry'

    - name: Strict Lock File Integrity Check
      run: |
        poetry lock --no-update
        poetry check --lock

    - name: Safe Sync and Install Dependencies
      run: poetry install --no-interaction --no-root --sync --with dev

    - name: Automatic Code Formatting & Commit
      run: |
        # Format the files
        poetry run black .
        poetry run ruff check . --fix
        poetry run ruff format .
        
        # Commit and push formatting fixes back to your branch if files changed
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        if [ -n "$(git status --porcelain)" ]; then
          git add .
          git commit -m "style: automated code formatting updates"
          git push
        else
          echo "No formatting changes needed."
        fi

    - name: Run Code Linters & Formatters
      run: |
        # Enforce strict compliance checks to verify everything is perfectly formatted
        poetry run black . --check
        poetry run ruff check .
        poetry run ruff format --check .

    - name: Execute Test Suite with Coverage
      env:
        PYTHONPATH: .
      run: poetry run pytest --cov=pipeline --cov-report=term-missing --cov-fail-under=70
