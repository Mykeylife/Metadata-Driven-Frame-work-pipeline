name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: pipx install poetry

    - name: Configure Poetry Cache Dynamically
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    # ADD THIS STEP HERE TO REPAIR THE HASH ALIGNMENT DYNAMICALLY:
    - name: Automatically Repair and Sync Lockfile Hash
      run: poetry lock --no-update

    - name: Install Project Dependencies
      run: poetry install --no-interaction

    - name: Strict Code Formatting Check (Black)
      run: poetry run black . --check

    - name: Linting and Import Order Verification (Ruff)
      run: |
        poetry run ruff check .
        poetry run ruff format --check .

    - name: Static Type Validation (Mypy)
      run: |
        if [ -d pipeline ]; then
          poetry run mypy --explicit-package-bases --disable-error-code method-assign pipeline
        else
          poetry run mypy --explicit-package-bases --disable-error-code method-assign .
        fi
        
    - name: Execute Insulated Unit Test Suite
      run: poetry run pytest --cov=pipeline --cov-report=term-missing
