[mypy]
# Core configuration layout flags
ignore_missing_imports = True
explicit_package_bases = True

# DataFactor strictness and module isolation enhancements
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
show_error_codes = True

# Prevent type check errors on test functions that lack returns
[mypy-tests.*]
ignore_errors = True

[mypy-test_dag_runner]
ignore_errors = True
