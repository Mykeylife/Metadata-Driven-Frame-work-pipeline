[mypy]
# Core configuration layout flags
ignore_missing_imports = True
explicit_package_bases = True
namespace_packages = True

# DataFactory strictness and module isolation enhancements
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
show_error_codes = True

# Configure module search paths so Mypy knows where packages live
mypy_path = .

# Target specific rule overrides for test suites if needed, but do not ignore all errors
[mypy-tests.*]
check_untyped_defs = False
